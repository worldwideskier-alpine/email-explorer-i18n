# Temporary: measures, in browsers this repository cannot run locally,
# whether a secret box is masked, and how the Turnstile widget sits on a
# narrow screen. Runs on the working branch only, and is removed once it has
# answered.
name: Browsers probe
on:
  push:
    branches: [claude/github-settings-migration-t81k5b]
    paths: ['.github/workflows/browsers-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
    steps:
      - name: Keep the address out of the log
        run: |
          host="${PRODUCTION_URL#https://}"
          echo "::add-mask::${host%%/*}"
      - name: Install browsers
        run: |
          cd "$RUNNER_TEMP"
          npm init -y >/dev/null
          npm i playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium firefox webkit >/dev/null
      - name: Probe
        run: |
          cd "$RUNNER_TEMP"
          cat > probe.mjs <<'JS'
          import { chromium, firefox, webkit } from "playwright";
          const base = process.env.PRODUCTION_URL.replace(/\/$/, "");
          const png = (b) => (b ? b.toString("base64") : null);

          // 3. The mask, in each engine, with the production stylesheet.
          const page0 = await (await fetch(base + "/")).text();
          const css = (page0.match(/\/assets\/index-[\w-]+\.css/) || [])[0];
          const cssText = css ? await (await fetch(base + css)).text() : "";
          console.log("css has the mask rule:", /-webkit-text-security:\s*disc/.test(cssText));
          for (const [name, engine] of [["chromium", chromium], ["firefox", firefox], ["webkit", webkit]]) {
            const browser = await engine.launch();
            const page = await browser.newPage({ viewport: { width: 400, height: 200 } });
            await page.setContent(`<style>${cssText}</style><input id="k" type="text" class="[-webkit-text-security:disc] border p-2" value="re_SECRET_1234" style="width:300px;font-size:16px">`);
            const out = await page.evaluate(() => {
              const el = document.getElementById("k");
              return {
                supports: CSS.supports("-webkit-text-security", "disc"),
                computed: getComputedStyle(el).getPropertyValue("-webkit-text-security"),
                type: el.type,
              };
            });
            const shot = await page.locator("#k").screenshot();
            console.log("MASK " + JSON.stringify({ engine: name, version: browser.version(), ...out, png: png(shot) }));
            await browser.close();
          }

          // 4. The widget on a narrow screen, next to a wider one.
          for (const width of [320, 400]) {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width, height: 700 }, locale: "ja-JP" });
            await page.goto(base + "/login", { waitUntil: "load" });
            await page.waitForTimeout(10000);
            const m = await page.evaluate(() => {
              const box = document.querySelector("form div.flex.justify-center");
              const r = box?.getBoundingClientRect();
              const host = box?.firstElementChild;
              const hr = host?.getBoundingClientRect();
              return {
                pageScrollWidth: document.documentElement.scrollWidth,
                viewport: document.documentElement.clientWidth,
                container: r ? { x: Math.round(r.x), width: Math.round(r.width), height: Math.round(r.height) } : null,
                widget: hr ? { x: Math.round(hr.x), width: Math.round(hr.width), height: Math.round(hr.height) } : null,
              };
            });
            const frameUrl = page.frames().map((f) => f.url()).find((u) => u.includes("challenges.cloudflare.com")) || "";
            const size = (frameUrl.match(/\/(normal|compact|flexible)(?:[/?]|$)/) || [])[1] || null;
            const shot = await page.screenshot({ clip: { x: 0, y: 0, width, height: 700 } });
            console.log("NARROW " + JSON.stringify({ width, size, ...m, png: png(shot) }));
            await browser.close();
          }
          JS
          node probe.mjs
