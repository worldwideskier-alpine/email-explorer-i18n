# Temporary: reads what Resend's send API calls the Content-ID of an inline
# attachment, from its published docs and its own SDK. No key, no request to
# the API itself. Runs on the working branch only, and is removed once it has
# answered.
name: Resend probe
on:
  push:
    branches: [claude/github-settings-migration-t81k5b]
    paths: ['.github/workflows/resend-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Docs
        run: |
          for u in \
            https://resend.com/docs/api-reference/emails/send-email.md \
            https://resend.com/docs/dashboard/emails/embed-inline-images.md \
            https://resend.com/docs/llms-full.txt; do
            echo "=== $u"
            curl -sSL --max-time 30 -o page.txt -w '%{http_code}\n' "$u" || true
            grep -n -i -E 'content_id|contentId|inline|cid:' page.txt | head -40 || true
          done
      - name: SDK
        run: |
          npm pack resend --silent >/dev/null 2>&1 && ls resend-*.tgz
          mkdir sdk && tar -xzf resend-*.tgz -C sdk
          grep -rn -o -E '.{0,80}(content_id|contentId|inline_content_id).{0,80}' sdk/package/dist | head -20
          grep -n '"version"' sdk/package/package.json
