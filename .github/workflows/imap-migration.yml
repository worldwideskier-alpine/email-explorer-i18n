name: IMAP Migration (Lolipop -> email-explorer-i18n)

on:
  workflow_dispatch:
    inputs:
      mailbox_address:
        description: "移行するメールアドレス"
        required: true
        type: choice
        options:
          - info@beautifulsnow.co.jp
          - uota@beautifulsnow.co.jp
      imap_folders:
        description: "取り込むIMAPフォルダ（カンマ区切り）"
        required: false
        default: "INBOX"
      since_date:
        description: "差分同期する場合のみ指定（ISO日時。例: 2026-08-02T00:00:00Z）"
        required: false
        default: ""
      dry_run:
        description: "true の場合は実際には書き込まず、件数だけ確認します"
        required: true
        type: boolean
        default: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/imap-migration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install

      - name: Migrate info@beautifulsnow.co.jp
        if: inputs.mailbox_address == 'info@beautifulsnow.co.jp'
        run: npm run migrate
        env:
          LOLIPOP_IMAP_HOST: ${{ vars.LOLIPOP_IMAP_HOST || 'imap.lolipop.jp' }}
          LOLIPOP_IMAP_PORT: ${{ vars.LOLIPOP_IMAP_PORT || '993' }}
          LOLIPOP_IMAP_SECURE: "true"
          LOLIPOP_IMAP_USER: info@beautifulsnow.co.jp
          LOLIPOP_IMAP_PASSWORD: ${{ secrets.LOLIPOP_PASSWORD_INFO }}
          LOLIPOP_IMAP_FOLDERS: ${{ inputs.imap_folders }}
          LOLIPOP_IMAP_SINCE: ${{ inputs.since_date }}
          TARGET_API_BASE_URL: https://email-explorer-ja.worldwideskier.workers.dev
          TARGET_MAILBOX_ID: info@beautifulsnow.co.jp
          TARGET_ADMIN_EMAIL: ${{ secrets.TARGET_ADMIN_EMAIL }}
          TARGET_ADMIN_PASSWORD: ${{ secrets.TARGET_ADMIN_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}

      - name: Migrate uota@beautifulsnow.co.jp
        if: inputs.mailbox_address == 'uota@beautifulsnow.co.jp'
        run: npm run migrate
        env:
          LOLIPOP_IMAP_HOST: ${{ vars.LOLIPOP_IMAP_HOST || 'imap.lolipop.jp' }}
          LOLIPOP_IMAP_PORT: ${{ vars.LOLIPOP_IMAP_PORT || '993' }}
          LOLIPOP_IMAP_SECURE: "true"
          LOLIPOP_IMAP_USER: uota@beautifulsnow.co.jp
          LOLIPOP_IMAP_PASSWORD: ${{ secrets.LOLIPOP_PASSWORD_UOTA }}
          LOLIPOP_IMAP_FOLDERS: ${{ inputs.imap_folders }}
          LOLIPOP_IMAP_SINCE: ${{ inputs.since_date }}
          TARGET_API_BASE_URL: https://email-explorer-ja.worldwideskier.workers.dev
          TARGET_MAILBOX_ID: uota@beautifulsnow.co.jp
          TARGET_ADMIN_EMAIL: ${{ secrets.TARGET_ADMIN_EMAIL }}
          TARGET_ADMIN_PASSWORD: ${{ secrets.TARGET_ADMIN_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
