# Temporary: asks production which language its Turnstile widget is drawn
# in. Runs on the working branch only, and is removed once it has answered.
name: Turnstile language probe
on:
  push:
    branches: [claude/github-settings-migration-t81k5b]
    paths: ['.github/workflows/turnstile-language-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
    steps:
      - name: Keep the address out of the log
        run: |
          host="${PRODUCTION_URL#https://}"
          echo "::add-mask::${host%%/*}"
      - name: Install Chromium
        run: |
          cd "$RUNNER_TEMP"
          npm init -y >/dev/null
          npm i playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Probe
        run: |
          cd "$RUNNER_TEMP"
          cat > probe.mjs <<'JS'
          import { chromium } from "playwright";
          const base = process.env.PRODUCTION_URL.replace(/\/$/, "");
          const clean = (s) => String(s)
            .replace(/0x[0-9A-Za-z_-]{8,}/g, "<sitekey>")
            .replace(/[A-Za-z0-9.-]+\.workers\.dev/g, "(address withheld)");
          const browser = await chromium.launch();
          for (const [label, browserLocale, pageLocale] of [
            ["page ja, browser en-US", "en-US", "ja"],
            ["page unset, browser ja-JP", "ja-JP", null],
          ]) {
            const ctx = await browser.newContext({ locale: browserLocale });
            await ctx.addInitScript(() => {
              let held;
              Object.defineProperty(window, "turnstile", {
                configurable: true,
                get: () => held,
                set: (v) => {
                  const render = v.render.bind(v);
                  v.render = (el, o) => { window.__tsOpts = { language: o.language, theme: o.theme, size: o.size }; return render(el, o); };
                  held = v;
                },
              });
            });
            if (pageLocale) {
              await ctx.addInitScript((l) => localStorage.setItem("email-explorer-locale", l), pageLocale);
            }
            const page = await ctx.newPage();
            const scripts = [];
            page.on("request", (r) => { if (/\/assets\/index-[\w-]+\.js$/.test(r.url())) scripts.push(r.url().split("/").pop()); });
            await page.goto(base + "/login", { waitUntil: "load" });
            await page.waitForTimeout(12000);
            const frames = page.frames().filter((f) => f.url().includes("challenges.cloudflare.com"));
            const out = { label, bundle: scripts, htmlLang: await page.evaluate(() => document.documentElement.lang), frames: [] };
            out.renderOptions = await page.evaluate(() => window.__tsOpts ?? null);
            const shot = await page.locator("iframe[src*='challenges.cloudflare.com']").first().screenshot({ timeout: 5000 }).catch(() => null);
            out.widgetPng = shot ? shot.toString("base64") : null;
            for (const f of frames) {
              let text = "";
              try { text = (await f.locator("body").innerText({ timeout: 3000 })).replace(/\s+/g, " ").slice(0, 200); } catch (e) { text = "(unreadable: " + e.message.split("\n")[0] + ")"; }
              const u = new URL(f.url());
              out.frames.push({ path: clean(u.pathname + u.search + u.hash), text });
            }
            console.log(clean(JSON.stringify(out, null, 1)));
            await ctx.close();
          }
          await browser.close();
          JS
          node probe.mjs
