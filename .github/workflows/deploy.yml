name: Deploy to Cloudflare

# It carries the full check set (lint, build, both test suites) because it
# is the last gate before production, and the same jobs are what check a pull
# request. The other workflow, night-check.yml, only reads.
on:
  push:
    branches: [main]
    # A commit that only touches the excluded files can't change what gets
    # deployed. docs/readme/ is taken back in: readmeDocs.test.ts reads it,
    # and a push that broke a summary went unchecked until the next code
    # push failed on it. Later patterns override earlier ones.
    paths:
      - '**'
      - '!docs/**'
      - 'docs/readme/**'
      - '!README.md'
      - '!LICENSE'
      - '!.editorconfig'
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Serialize deploys to the same ref. Deliberately never cancel one in flight:
# a half-applied deploy can leave the Worker and its assets out of step.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Read, and nothing else, for every job. The checking job had no block of its
# own and so ran with the repository's default token, whatever that was set
# to -- and the checks run every package install and build script there is,
# on every push. A dependency that turned hostile there would have held a token
# that could push to main, and a push to main deploys. The checkouts below do
# not leave the token in .git/config either.
permissions:
  contents: read

jobs:
  # The checks, as three jobs side by side rather than one after another: the
  # worker's suite is most of the time, and nothing in it waits on the lint,
  # the build or the dashboard's suite. Every one of them still runs on every
  # pull request, and the deploy waits for all three.
  lint-and-build:
    runs-on: ubuntu-latest
    # A hung install or test used to hold a runner for GitHub's six hours.
    # A whole run takes a few minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version is the root package.json's packageManager: one exact
      # release, the same here as on a contributor's machine. It is also the
      # pnpm this action installs first (11.25.0 for v6.1.0): named anything
      # else, the action switches to it with `pnpm self-update`, and pnpm 11
      # warns on every run about the shims the action itself left in
      # PNPM_HOME. Moving this action on means moving packageManager with it.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      # The build type-checks the dashboard, its tests included (vue-tsc).
      - run: pnpm run build

  # Needs no build: the pool reads the dashboard's assets from nowhere, and
  # the suite type-checks the Worker and its tests itself before it runs.
  test-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test-worker

  test-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test-dashboard

  # A push to main, or a run started by hand from main -- which only somebody
  # with write access can start, and which docs/deploying-your-own.md tells a
  # fork to use after setting its variables. Never a pull request.
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [lint-and-build, test-worker, test-dashboard]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # The Cloudflare token is not here. Set on the job, it went to every step
    # -- the third-party actions above and every package install and build
    # script among them -- when only the four steps that run wrangler need
    # it. Each of those carries it itself. The actions are pinned to commits
    # for the same reason: a tag can be moved to code nobody here has read.
    env:
      # This deployment's own values, so a fork configures itself without
      # editing a file this repository keeps changing. Every one is optional:
      # a repository variable that was never created arrives as an empty
      # string and the checked-in default in dev/wrangler.jsonc stands. See
      # docs/deploying-your-own.md.
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
      # Accepted as a secret as well, and the secret wins. As a variable the
      # address is printed in every step's env block below, and in the list
      # of bindings wrangler prints when it deploys -- a public log. A secret
      # is redacted in both. The variable stays for a fork that set one.
      ACCOUNT_RECOVERY_FROM: ${{ secrets.ACCOUNT_RECOVERY_FROM || vars.ACCOUNT_RECOVERY_FROM }}
      # Where this deployment answers, so the last step can ask it what it is
      # serving. A secret rather than a repository variable, and not because
      # an address is confidential: GitHub redacts a secret's value wherever
      # it turns up in a log, and the logs of a public repository are public.
      # A variable would be printed in the env block of every step that
      # carries it. As a secret it also redacts the line wrangler prints when
      # it deploys, which published the address on every run until now.
      # Optional, like the variables above: without it the check is skipped.
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version is the root package.json's packageManager: one exact
      # release, the same here as on a contributor's machine. It is also the
      # pnpm this action installs first (11.25.0 for v6.1.0): named anything
      # else, the action switches to it with `pnpm self-update`, and pnpm 11
      # warns on every run about the shims the action itself left in
      # PNPM_HOME. Moving this action on means moving packageManager with it.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Before the build, because the build copies the dashboard into the
      # place wrangler.jsonc points at and the deploy reads the config.
      - name: Apply this deployment's configuration
        run: node packages/worker/scripts/apply-deployment-config.mjs
      - run: pnpm run build
      - name: Ensure R2 bucket exists
        working-directory: packages/worker/dev
        # Asked first, and created only when it is not there. Creating one
        # that is already there is an error, and it put an [ERROR] in every
        # deploy's log that meant nothing -- the kind that teaches a reader
        # to skip the next one. Only info's exit status is wanted, so what it
        # prints is thrown away. A create that fails is still not a reason to
        # stop: the deploy below fails loudly if the bucket really is missing.
        run: |
          bucket="$(node ../scripts/bucket-name.mjs)"
          if npx wrangler r2 bucket info "$bucket" > /dev/null 2>&1; then
            echo "The R2 bucket is there."
          else
            npx wrangler r2 bucket create "$bucket" 2>&1 \
              | node ../scripts/withhold.mjs || true
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Before the deploy, not after: wrangler prints the address it deployed
      # to, and a value the runner has not been told to hide is a value it
      # cannot hide retroactively. The address itself is a secret and so is
      # redacted already; this covers the host on its own, which is what a
      # redirect or an error page would show.
      - name: Keep the address out of the log
        if: env.PRODUCTION_URL != ''
        run: |
          host="${PRODUCTION_URL#https://}"
          echo "::add-mask::${host%%/*}"
      # What is live before this deploy, so a deploy that fails its check
      # can be put back (the last step). Without it there is nothing to go
      # back to -- a first deploy, or a read that failed -- and a failure
      # then leaves the new version live and says so.
      - name: Note the version that is live now
        id: before
        working-directory: packages/worker/dev
        run: |
          set -o pipefail
          timeout 90 npx wrangler deployments status 2>&1 \
            | node ../scripts/withhold.mjs \
            | tee "$RUNNER_TEMP/status-before.txt" \
            || echo "could not read the live version; a failure below cannot be rolled back"
          node ../scripts/live-version.mjs \
            < "$RUNNER_TEMP/status-before.txt" >> "$GITHUB_OUTPUT" || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # wrangler prints the address it deployed to, and a fork that has not
      # set PRODUCTION_URL has nothing masking it -- so its address went
      # into a public log before its root existed, and whoever read that log
      # and registered first became root. Every step that runs wrangler
      # filters its output by the shape of an address: see
      # scripts/log-redaction.mjs.
      - name: Deploy Worker
        run: |
          set -o pipefail
          pnpm run deploy-dev-worker 2>&1 \
            | node packages/worker/scripts/withhold.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # No RESEND_API_KEY here: each person sets their own on their screen
      # (/admin, or /root for root), and nothing reads a deployment-wide one
      # any more; see app-settings.ts.
      - name: Set VAPID_PRIVATE_KEY secret
        working-directory: packages/worker/dev
        # Skipped when the secret is not set: piping an empty value would
        # either blank the Worker's key or fail the job after the Worker is
        # already live, and a fork without a VAPID pair simply has no push.
        run: |
          if [ -z "$VAPID_PRIVATE_KEY" ]; then
            echo "VAPID_PRIVATE_KEY is not set; push notifications stay off."
            exit 0
          fi
          set -o pipefail
          printf '%s' "$VAPID_PRIVATE_KEY" \
            | npx wrangler secret put VAPID_PRIVATE_KEY 2>&1 \
            | node ../scripts/withhold.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Setting a secret publishes a version of its own, so the id printed by
      # the deploy step above is not the one left running. This prints the one
      # that is. Informational: the deploy has already happened, and a hiccup
      # reading it back is not a reason to call the run failed.
      #
      # Every address is struck out of the output. wrangler names the account
      # that published a version, and the first run of this step put that
      # address into a public log -- which the rest of this commit's sibling
      # was written to stop happening. Struck out by shape rather than by
      # value, because the value is not known here and a redaction that has to
      # be configured is one that will one day not be.
      - name: Report the version that is live
        id: live
        working-directory: packages/worker/dev
        # pipefail, or the `|| echo` below answered for the filter, which
        # never fails, and a failed read printed nothing to say so. The
        # version it names is handed to the check below, which asks the
        # Worker whether it is the one running.
        run: |
          set -o pipefail
          timeout 90 npx wrangler deployments status 2>&1 \
            | node ../scripts/withhold.mjs \
            | tee "$RUNNER_TEMP/deployments-status.txt" \
            || echo "could not read the live version back"
          node ../scripts/live-version.mjs \
            < "$RUNNER_TEMP/deployments-status.txt" >> "$GITHUB_OUTPUT" || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # And the question the rest of it cannot answer: is the deployment
      # serving this build? An accepted upload is not a served one. See
      # scripts/deployment-check.mjs.
      - name: Check the deployment serves this build
        if: env.PRODUCTION_URL != ''
        run: node packages/worker/scripts/check-deployment.mjs
        env:
          EXPECTED_WORKER_VERSION: ${{ steps.live.outputs.version }}
      # A deploy that failed after it may have changed what is live -- the
      # check above said production is not serving this build, or the secret
      # step failed with the new code already up -- is put back to the
      # version that was live before it, rather than left for somebody to
      # notice. Only when what is live is no longer that version: a deploy
      # that failed before uploading changed nothing. The run stays failed,
      # so the failure is still mailed; production is simply not left on it.
      - name: Roll back to the version that was live before
        if: failure() && steps.before.outputs.version != ''
        working-directory: packages/worker/dev
        run: |
          set -o pipefail
          now="$(timeout 90 npx wrangler deployments status 2>&1 | node ../scripts/withhold.mjs | node ../scripts/live-version.mjs || true)"
          if [ "$now" = "version=$BEFORE" ]; then
            echo "The version that was live before this deploy is still live; nothing to roll back."
            exit 0
          fi
          timeout 120 npx wrangler rollback "$BEFORE" --yes \
            --message "The deploy of ${GITHUB_SHA::7} failed after it went live (run $GITHUB_RUN_ID)" 2>&1 \
            | node ../scripts/withhold.mjs
          after="$(timeout 90 npx wrangler deployments status 2>&1 | node ../scripts/withhold.mjs | node ../scripts/live-version.mjs || true)"
          if [ "$after" != "version=$BEFORE" ]; then
            echo "::error::Rolled back, but the live version is not the one from before (${after:-unreadable})."
            exit 1
          fi
          echo "::error::This deploy failed and was rolled back: $BEFORE is live again."
        env:
          BEFORE: ${{ steps.before.outputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
