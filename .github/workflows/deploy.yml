name: Deploy to Cloudflare

# This is the only workflow that runs on a push to main. It carries the full
# check set (lint, build, worker tests) because it is the last gate before
# production -- Build now runs on pull requests only, so nothing else checks
# the commit that is about to be deployed.
on:
  push:
    branches: [main]
    # A commit that only touches these can't change what gets deployed.
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
      - '.editorconfig'
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Serialize deploys to the same ref. Deliberately never cancel one in flight:
# a half-applied deploy can leave the Worker and its assets out of step.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm test

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-and-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Ensure R2 bucket exists
        working-directory: packages/worker/dev
        run: npx wrangler r2 bucket create email-explorer-ja || true
      - name: Deploy Worker
        run: pnpm run deploy-dev-worker
      - name: Set RESEND_API_KEY secret
        working-directory: packages/worker/dev
        run: printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      - name: Set VAPID_PRIVATE_KEY secret
        working-directory: packages/worker/dev
        run: printf '%s' "$VAPID_PRIVATE_KEY" | npx wrangler secret put VAPID_PRIVATE_KEY
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
