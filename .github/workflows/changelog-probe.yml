# Temporary: reads what changed in pinia 3 -> 4 and postal-mime 3 -> 4, from
# their own changelogs and published packages, before either is taken. Runs
# on the working branch only, and is removed once it has answered.
name: Changelog probe
on:
  push:
    branches: [claude/github-settings-migration-t81k5b]
    paths: ['.github/workflows/changelog-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: pinia
        run: |
          curl -sSL --max-time 30 -o pinia.md https://raw.githubusercontent.com/vuejs/pinia/v4.0.3/packages/pinia/CHANGELOG.md -w '%{http_code}\n'
          # Everything above the 3.0.4 entry: what 4.x brought.
          awk '/^#+ \[?3\.0\.4/{exit} {print}' pinia.md | head -150
          echo "=== peers and engines"
          npm view pinia@4.0.3 peerDependencies engines dependencies --json
      - name: postal-mime
        run: |
          curl -sSL --max-time 30 -o pm.md https://raw.githubusercontent.com/postalsys/postal-mime/master/CHANGELOG.md -w '%{http_code}\n'
          awk '/^#+ \[?3\.0\.0/{exit} {print}' pm.md | head -150
          echo "=== versions"
          npm view postal-mime versions --json | tail -8
          npm view postal-mime@4.0.0 dependencies engines --json
