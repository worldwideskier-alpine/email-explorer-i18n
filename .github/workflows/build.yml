name: Build

# Pull requests only. On a push to main this ran lint, build and the worker
# tests against the same commit the Deploy workflow was already checking, so
# every commit was examined twice and billed twice. Deploy carries the tests
# now, and it is the run that has to pass before anything ships.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
      - '.editorconfig'

# A superseded pull-request run is of no interest to anyone.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Check Lint
        run: pnpm lint
      - name: Build everything
        run: pnpm build
      - name: Run Worker Tests
        run: cd packages/worker && pnpm test
      - name: Package artifact
        run: pnpm package
      - name: Archive package
        uses: actions/upload-artifact@v7
        with:
          name: email-explorer-npm-package
          path: packages/worker/email-explorer-*
