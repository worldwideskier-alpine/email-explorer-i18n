name: Dedupe Mailbox Folder (email-explorer-i18n)

on:
  workflow_dispatch:
    inputs:
      mailbox_address:
        description: "対象メールアドレス"
        required: true
        type: choice
        options:
          - info@beautifulsnow.co.jp
          - uota@beautifulsnow.co.jp
      folder:
        description: "対象フォルダID（例: inbox、または領収書類等のフォルダID）"
        required: true
        default: "inbox"
      apply:
        description: "true にすると実際に重複を削除します。false ならレポートのみ。"
        required: true
        type: boolean
        default: false

jobs:
  dedupe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/imap-migration
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dedupe
        env:
          TARGET_API_BASE_URL: https://email-explorer-ja.worldwideskier.workers.dev
          TARGET_MAILBOX_ID: ${{ inputs.mailbox_address }}
          TARGET_ADMIN_EMAIL: ${{ secrets.TARGET_ADMIN_EMAIL }}
          TARGET_ADMIN_PASSWORD: ${{ secrets.TARGET_ADMIN_PASSWORD }}
          DEDUPE_FOLDER: ${{ inputs.folder }}
          APPLY: ${{ inputs.apply }}
