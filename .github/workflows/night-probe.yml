# Temporary: reads what the nightly run per mailbox left in
# the bucket -- the run's record and each mailbox's backup and purge result.
# Mailbox addresses are replaced by labels before anything is printed, and
# the output goes through withhold.mjs as well. Runs on the working branch
# only, and is removed once it has answered.
name: Night probe
on:
  push:
    branches: [claude/github-settings-migration-t81k5b]
    paths: ['.github/workflows/night-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the night
        working-directory: packages/worker/dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/night.mjs" <<'JS'
          import { execFileSync } from "node:child_process";
          const bucket = execFileSync("node", ["../scripts/bucket-name.mjs"]).toString().trim();
          const get = (key) => {
            try {
              const out = execFileSync("npx", ["-y", "wrangler@4.141.0", "r2", "object", "get", `${bucket}/${key}`, "--remote", "--pipe"], { stdio: ["ignore", "pipe", "ignore"] });
              return JSON.parse(out.toString());
            } catch (e) { return { unreadable: key, why: String(e.status ?? e.message).slice(0, 80) }; }
          };
          // Every mailbox's settings object, through the R2 API: the record
          // names only the one furthest from done.
          const listed = async (prefix) => {
            const url = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${bucket}/objects?prefix=${encodeURIComponent(prefix)}&per_page=100`;
            const res = await fetch(url, { headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } });
            const body = await res.json().catch(() => ({}));
            if (!res.ok) return { refused: res.status, errors: (body.errors ?? []).map((e) => e.code) };
            return (body.result ?? []).map((o) => o.key);
          };
          const labels = new Map();
          const label = (id) => { if (!labels.has(id)) labels.set(id, `mailbox-${labels.size + 1}`); return labels.get(id); };
          const last = get("maintenance/last-run.json");
          const ids = [];
          if (last?.backupProgress?.mailbox) ids.push(last.backupProgress.mailbox);
          const keys = await listed("mailboxes/");
          if (Array.isArray(keys)) {
            for (const k of keys) { const id = k.slice("mailboxes/".length, -".json".length); if (k.endsWith(".json") && !ids.includes(id)) ids.push(id); }
          } else console.log("listing refused:", JSON.stringify(keys));
          if (last?.backupProgress?.mailbox) last.backupProgress.mailbox = label(last.backupProgress.mailbox);
          console.log("=== last run");
          console.log(JSON.stringify(last, null, 1));
          const carry = await listed("backup-carry/");
          console.log("=== paused backups left behind:", Array.isArray(carry) ? carry.length : JSON.stringify(carry));
          console.log("=== continuing:", JSON.stringify((last?.continuing ?? []).map((c) => ({ ...c, mailbox: label(c.mailbox) }))));
          console.log("=== each mailbox");
          for (const id of ids) {
            const s = get(`mailboxes/${id}.json`);
            console.log(JSON.stringify({ mailbox: label(id), autoBackup: s?.autoBackup, spamRetention: s?.spamRetention ? { enabled: s.spamRetention.enabled, lastResult: s.spamRetention.lastResult, lastRunAt: s.spamRetention.lastRunAt } : undefined }, null, 1));
          }
          JS
          node "$RUNNER_TEMP/night.mjs" 2>&1 | node ../scripts/withhold.mjs
