# Temporary: reads the nightly run's record and the backup state of the
# mailboxes it touched -- how many messages and bytes each archive holds,
# to judge whether a backup fits in a Durable Object alarm's CPU limit. Mailbox addresses
# are replaced by labels before anything is printed, and the output goes
# through withhold.mjs as well. Runs on the working branch only, and is
# removed once it has answered.
name: Night probe
on:
  push:
    branches: [claude/github-settings-migration-t81k5b]
    paths: ['.github/workflows/night-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the night
        working-directory: packages/worker/dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/night.mjs" <<'JS'
          import { execFileSync } from "node:child_process";
          const bucket = execFileSync("node", ["../scripts/bucket-name.mjs"]).toString().trim();
          const get = (key) => {
            try {
              const out = execFileSync("npx", ["-y", "wrangler@4.141.0", "r2", "object", "get", `${bucket}/${key}`, "--remote", "--pipe"], { stdio: ["ignore", "pipe", "ignore"] });
              return JSON.parse(out.toString());
            } catch (e) { return { unreadable: key, why: String(e.status ?? e.message).slice(0, 80) }; }
          };
          const labels = new Map();
          const label = (id) => { if (!labels.has(id)) labels.set(id, `mailbox-${labels.size + 1}`); return labels.get(id); };
          const hide = (night) => {
            if (night?.backupProgress?.mailbox) night.backupProgress.mailbox = label(night.backupProgress.mailbox);
            return night;
          };
          const last = get("maintenance/last-run.json");
          const history = get("maintenance/history.json");
          const nights = Array.isArray(history) ? history : (history?.nights ?? history?.runs ?? history);
          // Labels first from the newest night, so mailbox-1 is tonight's.
          const ids = [];
          for (const n of [last, ...(Array.isArray(nights) ? nights : [])]) {
            const id = n?.backupProgress?.mailbox;
            if (id && !ids.includes(id)) ids.push(id);
          }
          const backups = ids.map((id) => {
            const s = get(`mailboxes/${id}.json`);
            return { mailbox: label(id), autoBackup: s?.autoBackup ?? s };
          });
          console.log("=== last run");
          console.log(JSON.stringify(hide(last), null, 1));
          console.log("=== earlier nights, newest first");
          for (const n of Array.isArray(nights) ? nights : [nights]) console.log(JSON.stringify(hide(n)));
          console.log("=== backup state of the mailboxes named above");
          for (const b of backups) console.log(JSON.stringify(b, null, 1));
          JS
          node "$RUNNER_TEMP/night.mjs" 2>&1 | node ../scripts/withhold.mjs
