name: Cloudflare Email Routing status (read-only)

# Reports how Cloudflare Email Routing is configured for the domain: whether
# routing is on, whether a catch-all rule exists, and which addresses are
# routed to this Worker. Read-only -- it never changes any setting.
#
# The domain comes from a secret, not from a dispatch input.
#
# The input was here so the domain would not be written into a file this
# public repository keeps. It achieved that and missed the point: the runner
# prints every step's environment and its rendered script, so the first run of
# this workflow published the domain in its log anyway -- as `ZONE:` and again
# in the line that echoed it. An input cannot be redacted, because nothing
# tells the runner it is worth hiding. A secret's value is replaced with ***
# everywhere it appears, including inside the API responses printed below.
#
# Not confidentiality theatre: this repository is public and so are its logs.
on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query Email Routing configuration
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE: ${{ secrets.EMAIL_ROUTING_ZONE }}
        run: |
          set -uo pipefail

          if [ -z "$ZONE" ]; then
            echo "Set the repository secret EMAIL_ROUTING_ZONE to the domain"
            echo "to inspect, then run this again. It is a secret so that the"
            echo "domain stays out of this public repository's logs."
            exit 1
          fi

          api() {
            curl -sS -H "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/$1"
          }

          echo "=== zone lookup ==="
          zones=$(api "zones?name=$ZONE")
          echo "$zones" | jq '{success, errors}'
          zone_id=$(echo "$zones" | jq -r '.result[0].id // empty')
          if [ -z "$zone_id" ]; then
            echo "Could not resolve a zone id -- the API token may not cover this zone."
            exit 1
          fi
          echo "zone id resolved: ${zone_id:0:6}..."

          echo
          echo "=== Email Routing enabled? ==="
          api "zones/$zone_id/email/routing" \
            | jq '{success, errors, enabled: .result.enabled, status: .result.status, name: .result.name}'

          echo
          echo "=== Catch-all rule ==="
          api "zones/$zone_id/email/routing/rules/catch_all" \
            | jq '{success, errors, enabled: .result.enabled,
                   matchers: .result.matchers, actions: .result.actions}'

          echo
          echo "=== Individual routing rules ==="
          api "zones/$zone_id/email/routing/rules?per_page=50" \
            | jq '{success, errors,
                   rules: [.result[]? | {name, enabled,
                                         matchers: [.matchers[]? | {type, field, value}],
                                         actions:  [.actions[]?  | {type, value}]}]}'

          echo
          echo "=== Destination addresses (where forwarding rules can point) ==="
          account_id="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          api "accounts/$account_id/email/routing/addresses?per_page=50" \
            | jq '{success, errors,
                   addresses: [.result[]? | {email, verified}]}'
