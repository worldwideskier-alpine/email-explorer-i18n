name: IMAP Backfill Source (Lolipop -> email-explorer-ja)

on:
  workflow_dispatch:
    inputs:
      mailbox_address:
        description: "対象のメールアドレス"
        required: true
        type: choice
        options:
          - info@example.net
          - user@example.net
      imap_folders:
        description: "対象のIMAPフォルダ（カンマ区切り、既に移行済みのフォルダのみ）"
        required: true
      since_date:
        description: "差分のみ確認する場合のみ指定（ISO日時）"
        required: false
        default: ""
      dry_run:
        description: "true の場合は実際には書き込まず、内容だけ確認します"
        required: true
        type: boolean
        default: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/imap-migration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Backfill info@example.net
        if: inputs.mailbox_address == 'info@example.net'
        run: npm run backfill-source
        env:
          LOLIPOP_IMAP_HOST: ${{ vars.LOLIPOP_IMAP_HOST || 'imap.lolipop.jp' }}
          LOLIPOP_IMAP_PORT: ${{ vars.LOLIPOP_IMAP_PORT || '993' }}
          LOLIPOP_IMAP_SECURE: "true"
          LOLIPOP_IMAP_USER: info@example.net
          LOLIPOP_IMAP_PASSWORD: ${{ secrets.LOLIPOP_PASSWORD_INFO }}
          LOLIPOP_IMAP_FOLDERS: ${{ inputs.imap_folders }}
          LOLIPOP_IMAP_SINCE: ${{ inputs.since_date }}
          TARGET_API_BASE_URL: https://email-explorer-ja.your-subdomain.workers.dev
          TARGET_MAILBOX_ID: info@example.net
          TARGET_ADMIN_EMAIL: ${{ secrets.TARGET_ADMIN_EMAIL }}
          TARGET_ADMIN_PASSWORD: ${{ secrets.TARGET_ADMIN_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}

      - name: Backfill user@example.net
        if: inputs.mailbox_address == 'user@example.net'
        run: npm run backfill-source
        env:
          LOLIPOP_IMAP_HOST: ${{ vars.LOLIPOP_IMAP_HOST || 'imap.lolipop.jp' }}
          LOLIPOP_IMAP_PORT: ${{ vars.LOLIPOP_IMAP_PORT || '993' }}
          LOLIPOP_IMAP_SECURE: "true"
          LOLIPOP_IMAP_USER: user@example.net
          LOLIPOP_IMAP_PASSWORD: ${{ secrets.LOLIPOP_PASSWORD_UOTA }}
          LOLIPOP_IMAP_FOLDERS: ${{ inputs.imap_folders }}
          LOLIPOP_IMAP_SINCE: ${{ inputs.since_date }}
          TARGET_API_BASE_URL: https://email-explorer-ja.your-subdomain.workers.dev
          TARGET_MAILBOX_ID: user@example.net
          TARGET_ADMIN_EMAIL: ${{ secrets.TARGET_ADMIN_EMAIL }}
          TARGET_ADMIN_PASSWORD: ${{ secrets.TARGET_ADMIN_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
