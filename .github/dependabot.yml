version: 2
updates:
  - package-ecosystem: "npm"
    # One entry per package.json in the workspace. A path that is not a
    # directory holding a manifest is skipped without any error, which is how
    # "/pnpm-lock.yaml" and a "/packages/github-action" that does not exist
    # went unnoticed -- and why packages/dashboard was never watched.
    directories:
      - "/"
      - "/packages/dashboard"
      - "/packages/worker"
      - "/packages/worker/dev"
    schedule:
      interval: "weekly"
    groups:
      prod-deps:
        dependency-type: "production"
      dev-deps:
        dependency-type: "development"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
