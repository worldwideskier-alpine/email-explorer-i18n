version: 2
updates:
  - package-ecosystem: "npm"
    # The workspace root only. This is a pnpm workspace with a single
    # pnpm-lock.yaml at the root, and Dependabot resolves every member from
    # there -- the hono bump for packages/worker and the axios bump for
    # packages/dashboard both arrived from this one entry.
    #
    # Listing the member directories as well looks more thorough and is in
    # fact broken: run against "/packages/worker", Dependabot edits that
    # package.json but finds no lockfile beside it, so the root lockfile is
    # left behind and every such pull request fails at
    # "pnpm install --frozen-lockfile" with
    #
    #   specifiers in the lockfile don't match specifiers in package.json
    #
    # A rebase cannot fix it, because the next run reproduces it. Every pull
    # request titled "... in /packages/worker ..." failed this way, while the
    # ones from the root merged cleanly.
    directory: "/"
    # Monthly, a few pull requests at a time, and never rebased. None of these
    # is merged on GitHub: a merge to main deploys, so each update is taken on
    # the working branch, tested and pushed, and Dependabot then closes its
    # pull request as up to date. What its pull requests did besides was
    # notify -- every push to main rebased each open one, and a push that
    # touched dependencies closed some and opened others, seven pull requests
    # moving within three minutes on 2026-09-30, each a mail to the owner.
    # Security fixes do not wait for this: they come as security updates,
    # which the schedule, the limit and the groups here do not hold back.
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    # Majors are grouped apart from minors and patches: a merge to main
    # deploys straight to production, and a breaking bump of postal-mime or
    # zod is not something to wave through alongside a routine patch. They
    # come as one pull request to be read one by one, not one pull request
    # each. They are deliberately not ignored (but for the few below) --
    # upstream is active, and a security fix sometimes lands only in a new
    # major.
    groups:
      prod-deps:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev-deps:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      majors:
        update-types: ["major"]
    # The majors that are ignored. @types/node describes a Node, and the one
    # that matters is the one CI and the deploy run (node-version in
    # deploy.yml), not the newest: typed for Node 26 while running Node 22,
    # an API Node 22 does not have compiles and then fails at run time. It
    # carries no code, so no security fix waits in its next major. Move it
    # with node-version, by hand.
    #
    # vitest follows @cloudflare/vitest-pool-workers, which runs the worker
    # suite and names the vitest it takes (^4.1.0 in 0.22.0, still the
    # latest). vitest 5 under it started no test at all (#48); both suites
    # stay on one vitest. Move it when the pool's peer range does.
    #
    # TypeScript follows vue-tsc, which type-checks the dashboard in every
    # build through TypeScript's own JavaScript API (typescript/lib/tsc).
    # TypeScript 7, the native rewrite, does not ship that API: vue-tsc
    # 3.3.11 stopped at ERR_PACKAGE_PATH_NOT_EXPORTED before checking a file
    # (#26 and #50). Move it when vue-tsc supports 7.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    # The same terms, for the same reason; the actions are pinned to commits
    # (workflowGuards.test.ts), and one pull request carries all of them.
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    groups:
      actions:
        patterns: ["*"]
