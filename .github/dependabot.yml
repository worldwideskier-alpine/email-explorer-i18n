version: 2
updates:
  - package-ecosystem: "npm"
    # The workspace root only. This is a pnpm workspace with a single
    # pnpm-lock.yaml at the root, and Dependabot resolves every member from
    # there -- the hono bump for packages/worker and the axios bump for
    # packages/dashboard both arrived from this one entry.
    #
    # Listing the member directories as well looks more thorough and is in
    # fact broken: run against "/packages/worker", Dependabot edits that
    # package.json but finds no lockfile beside it, so the root lockfile is
    # left behind and every such pull request fails at
    # "pnpm install --frozen-lockfile" with
    #
    #   specifiers in the lockfile don't match specifiers in package.json
    #
    # A rebase cannot fix it, because the next run reproduces it. Every pull
    # request titled "... in /packages/worker ..." failed this way, while the
    # ones from the root merged cleanly.
    directory: "/"
    schedule:
      interval: "weekly"
    # Only minor and patch updates are grouped. A major that isn't in any
    # group arrives as its own pull request instead, which is the point: a
    # merge to main deploys straight to production, and a breaking bump of
    # postal-mime or zod is not something to wave through alongside a routine
    # patch. Majors are deliberately not ignored (one exception, below) --
    # upstream is active, and a security fix sometimes lands only in a new
    # major.
    groups:
      prod-deps:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev-deps:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    # The one major that is ignored. @types/node describes a Node, and the one
    # that matters is the one CI and the deploy run (node-version in
    # deploy.yml), not the newest: typed for Node 26 while running Node 22,
    # an API Node 22 does not have compiles and then fails at run time. It
    # carries no code, so no security fix waits in its next major. Move it
    # with node-version, by hand.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
