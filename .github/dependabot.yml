version: 2
updates:
  - package-ecosystem: "npm"
    # One entry per package.json in the workspace. A path that is not a
    # directory holding a manifest is skipped without any error, which is how
    # "/pnpm-lock.yaml" and a "/packages/github-action" that does not exist
    # went unnoticed -- and why packages/dashboard was never watched.
    directories:
      - "/"
      - "/packages/dashboard"
      - "/packages/worker"
      - "/packages/worker/dev"
    schedule:
      interval: "weekly"
    # Only minor and patch updates are grouped. A major that isn't in any
    # group arrives as its own pull request instead, which is the point: a
    # merge to main deploys straight to production, and a breaking bump of
    # postal-mime or zod is not something to wave through alongside a routine
    # patch. Majors are deliberately not ignored -- upstream is active, and a
    # security fix sometimes lands only in a new major.
    groups:
      prod-deps:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev-deps:
        dependency-type: "development"
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
